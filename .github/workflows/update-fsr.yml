name: Update FSR

on:
  workflow_dispatch:
    inputs:
      sdk-release:
        description: Official AMD FSR SDK release tag
        required: true
        default: v2.4.0

permissions:
  contents: read

concurrency:
  group: update-fsr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          pip-version: '26.2.1'
      - name: Download one official SDK
        env:
          GH_TOKEN: ${{ github.token }}
          FSR_SDK_RELEASE: ${{ inputs.sdk-release }}
        run: python .github/scripts/build_fsr.py prepare --root "${{ runner.temp }}/sdk" --release "$FSR_SDK_RELEASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fsr-sdk
          path: ${{ runner.temp }}/sdk
          compression-level: 0
          retention-days: 1

  build:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          pip-version: '26.2.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fsr-sdk
          path: ${{ runner.temp }}/sdk
      - name: Configure Windows compiler
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
              "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
      - name: Install extraction dependency
        run: python -m pip install clang==21.1.7
      - name: Extract declarations and validate official exports and ABI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/build_fsr.py build --root "${{ runner.temp }}/sdk" --scratch "${{ runner.temp }}/build" --output "${{ runner.temp }}/artifacts/fsr-win-x64"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
      - name: Generate and verify bindings on Windows
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/scripts/build_fsr.py merge --root "${{ runner.temp }}/artifacts" --output .
          dotnet run --project FSR.NET.Generator -- .
          dotnet build FSR.NET.slnx -c Release --warnaserror
          dotnet pack FSR.NET -c Release --no-build -o "${{ runner.temp }}/packages"
          $package = (Get-ChildItem "${{ runner.temp }}/packages/FSR.NET.*.nupkg").FullName
          python .github/scripts/verify_fsr.py --root . --package "$package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fsr-win-x64
          path: ${{ runner.temp }}/artifacts/fsr-win-x64
          retention-days: 1

  update:
    if: github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          pip-version: '26.2.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fsr-win-x64
          path: ${{ runner.temp }}/artifacts/fsr-win-x64
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
      - name: Merge the validated Windows x64 target
        run: python .github/scripts/build_fsr.py merge --root "${{ runner.temp }}/artifacts" --output .
      - name: Generate bindings and check the complete solution
        run: |
          dotnet run --project FSR.NET.Generator -- .
          dotnet build FSR.NET.slnx -c Release --warnaserror
          dotnet format FSR.NET.slnx --no-restore --verify-no-changes --include-generated --exclude FSR.NET.Generator/obj FSR.NET/obj --severity warn
          dotnet pack FSR.NET -c Release --no-build -o "${{ runner.temp }}/packages"
          python .github/scripts/verify_fsr.py --root . --package "${{ runner.temp }}"/packages/FSR.NET.*.nupkg
      - name: Commit the complete update
        env:
          FSR_TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add native FSR.NET.Generator/ast.json FSR.NET NuGet.Packaging.props
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update FSR SDK, bindings and native assets'
          git push origin "HEAD:refs/heads/$FSR_TARGET_BRANCH"

  cleanup:
    if: always()
    needs: [prepare, build, update]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - name: Delete temporary workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[].id')"
          for artifact_id in $artifact_ids; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
